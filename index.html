<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14212b"><title>Kegel & Mobility</title>
<style>
:root{--bg:#101820;--panel:#182631;--panel2:#203440;--text:#f2f7f7;--muted:#9fb1ba;--teal:#63ddc3;--line:#2a414d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:600px;margin:auto;padding:18px 15px 100px}.head{display:flex;align-items:center;gap:12px;padding:10px 0 22px}.logo{background:var(--teal);color:#092521;border-radius:15px;width:48px;height:48px;display:grid;place-items:center;font-weight:900}.head h1{font-size:19px;margin:0}.head p{font-size:10px;color:var(--teal);letter-spacing:1.5px;margin:3px 0}.head button{margin-left:auto}.title{font-size:29px;letter-spacing:-.7px;margin:8px 0}.sub{color:var(--muted);font-size:14px;line-height:1.5}.hero{background:linear-gradient(135deg,#214c4c,#1a323d);border:1px solid #2b605c;border-radius:24px;padding:22px;margin:18px 0}.hero h2{font-size:26px;margin:10px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0}.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px}.stat b{font-size:22px;display:block}.stat small{color:var(--muted);font-size:11px}.btn{background:var(--teal);color:#092521;border:0;border-radius:13px;padding:13px 15px;font-weight:800;font-size:14px}.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--text)}.danger{background:#492e35;color:#ffdada}.block{width:100%;margin-top:8px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(600px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#111c24f5;border-top:1px solid var(--line);padding:9px 8px calc(10px + env(safe-area-inset-bottom));z-index:5}.nav button{background:none;border:0;color:var(--muted);font-size:11px;padding:6px}.nav button.active{color:var(--teal)}.nav span{display:block;font-size:20px;margin-bottom:3px}.tag{font-size:10px;background:#244b49;color:var(--teal);padding:5px 7px;border-radius:7px;display:inline-block;margin-bottom:6px}.field{background:#101b23;border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--text);width:100%;margin-top:5px}.setting{padding:12px 0;border-bottom:1px solid var(--line)}.setting:last-child{border:0}.setting label{font-size:13px}.photo{width:100%;max-height:250px;object-fit:cover;border-radius:14px;background:#263b45}.small{font-size:11px;color:var(--muted);line-height:1.5}.timer{width:220px;height:220px;border-radius:50%;background:conic-gradient(var(--teal) var(--pct,0%),#2a3d47 0);margin:18px auto;display:grid;place-items:center}.timer-in{width:198px;height:198px;border-radius:50%;background:var(--bg);display:grid;place-content:center;text-align:center}.time{font-size:48px;font-weight:850}.center{text-align:center}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.day{padding:9px 0;border-radius:8px;background:#20323d;font-size:12px;color:var(--muted)}.day.done{background:#245b52;color:#c2fff0}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#dffff6;color:#0b2c26;padding:12px 15px;border-radius:12px;display:none;z-index:9;max-width:90%;font-weight:700;font-size:13px}a{color:var(--teal)}.exercise{margin:16px 0}.exercise h3{margin:0 0 7px}.exercise p{color:var(--muted);font-size:13px;line-height:1.5}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style></head><body><div class="app">
<header class="head"><div class="logo">KM</div><div><p id="eyebrow">RUANG LATIHAN PERIBADI</p><h1>Kegel & Mobility</h1></div><button class="btn secondary" id="quickLang">BM / EN</button></header>
<main id="view"></main></div><nav class="nav"><button data-page="home" class="active"><span>⌂</span><b data-ms="Utama" data-en="Home">Utama</b></button><button data-page="workouts"><span>◉</span><b data-ms="Latihan" data-en="Workouts">Latihan</b></button><button data-page="progress"><span>▥</span><b data-ms="Kemajuan" data-en="Progress">Kemajuan</b></button><button data-page="settings"><span>⚙</span><b data-ms="Tetapan" data-en="Settings">Tetapan</b></button></nav><div class="toast" id="toast"></div>
<script>
const words={
ms:{hello:'Ruang latihan anda',today:'Pelan latihan hari ini',start:'Mula latihan',week:'Sesi minggu ini',minutes:'Minit minggu ini',streak:'Hari berturut',quick:'Mula cepat',all:'Lihat semua',kegel:'Latihan Kegel',mobility:'Mobiliti pelvis',kegelDesc:'Kecut dan lepaskan otot lantai pelvis.',mobDesc:'Pergerakan lembut untuk pinggul dan pelvis.',choose:'Pilih latihan',history:'Sejarah latihan',noHistory:'Belum ada rekod latihan.',goal:'Sasaran mingguan',done:'Selesai',cancel:'Batal',pause:'Jeda',resume:'Sambung',skip:'Langkau',finish:'Tamatkan sesi',ready:'Bersedia',hold:'Kecut / tahan',relax:'Lepaskan / rehat',round:'Pusingan',of:'daripada',instructions:'Cara melakukan',safety:'Hentikan jika sakit atau tidak selesa. Jangan tahan nafas.',progress:'Kemajuan',export:'Eksport sandaran',import:'Import sandaran',language:'Bahasa aplikasi',save:'Simpan tetapan',seconds:'saat',sound:'Bunyi pemasa',saved:'Tetapan disimpan',exported:'Fail sandaran dimuat turun',imported:'Sandaran diimport',badFile:'Fail sandaran tidak sah',completed:'Latihan selesai!',timerHint:'Kekalkan skrin terbuka semasa latihan.',time:'Tempoh',total:'Jumlah sesi',thisWeek:'Sesi minggu ini',noData:'Lengkapkan sesi pertama untuk melihat kemajuan.',step:'Langkah',next:'Seterusnya',back:'Kembali',privacy:'Data disimpan dalam pelayar pada peranti ini sahaja. Tiada akaun atau pangkalan data awan. Buat sandaran berkala.',addHome:'Tambah ke Skrin Utama',addHomeText:'Dalam Safari, tekan Kongsi → Tambah ke Skrin Utama.',clear:'Padam semua rekod',confirmClear:'Padam semua rekod latihan?',empty:'Belum ada sesi direkodkan',kegelHow:'Duduk atau baring dengan selesa. Kecutkan otot seolah-olah menahan angin. Jangan ketatkan punggung atau paha. Bernafas seperti biasa, kemudian lepaskan sepenuhnya.',tilt:'Pelvic tilt',bridge:'Glute bridge',catcow:'Cat–cow',child:'Child’s pose',butterfly:'Regangan rama-rama',hip:'Regangan fleksor pinggul',tiltHow:'Baring dengan lutut bengkok dan kaki rata. Ratakan belakang bawah perlahan ke lantai dengan mencondongkan pelvis, kemudian kembali neutral.',bridgeHow:'Baring dengan lutut bengkok dan kaki selebar pinggul. Tekan tumit dan angkat pinggul secara terkawal. Elakkan melengkungkan belakang berlebihan.',catHow:'Mulakan dengan tangan dan lutut di lantai. Bulatkan belakang perlahan, kemudian kembali dan lengkungkan sedikit sambil bernafas.',childHow:'Melutut dan gerakkan pinggul ke arah tumit mengikut keselesaan. Hulurkan tangan ke hadapan dan bernafas perlahan.',butterflyHow:'Duduk dengan tapak kaki bertemu dan biarkan lutut turun secara semula jadi. Jangan tekan lutut dengan kuat.',hipHow:'Dalam posisi separuh melutut, kekalkan badan tegak dan gerakkan pinggul ke hadapan sedikit sehingga terasa regangan lembut.',public:'Foto rujukan: Wikimedia Commons / CDC (sahkan lesen sumber sebelum guna)'}, 
en:{hello:'Your training space',today:"Today's workout",start:'Start workout',week:'Sessions this week',minutes:'Minutes this week',streak:'Day streak',quick:'Quick start',all:'View all',kegel:'Kegel training',mobility:'Pelvic mobility',kegelDesc:'Contract and release the pelvic floor muscles.',mobDesc:'Gentle movement for the hips and pelvis.',choose:'Choose a workout',history:'Workout history',noHistory:'No sessions recorded yet.',goal:'Weekly goal',done:'Complete',cancel:'Cancel',pause:'Pause',resume:'Resume',skip:'Skip',finish:'Finish session',ready:'Get ready',hold:'Contract / hold',relax:'Release / rest',round:'Round',of:'of',instructions:'How to do it',safety:'Stop if you feel pain or discomfort. Do not hold your breath.',progress:'Progress',export:'Export backup',import:'Import backup',language:'App language',save:'Save settings',seconds:'seconds',sound:'Timer sound',saved:'Settings saved',exported:'Backup downloaded',imported:'Backup imported',badFile:'Invalid backup file',completed:'Workout complete!',timerHint:'Keep the screen open during your session.',time:'Duration',total:'Total sessions',thisWeek:'Sessions this week',noData:'Complete your first session to see progress.',step:'Step',next:'Next',back:'Back',privacy:'Data is stored only in this browser on this device. No account or cloud database. Back up regularly.',addHome:'Add to Home Screen',addHomeText:'In Safari, tap Share → Add to Home Screen.',clear:'Delete all records',confirmClear:'Delete all workout records?',empty:'No sessions recorded yet',kegelHow:'Sit or lie comfortably. Gently contract the muscles as if preventing wind. Do not tighten your buttocks or thighs. Breathe normally, then fully release.',tilt:'Pelvic tilt',bridge:'Glute bridge',catcow:'Cat–cow',child:'Child’s pose',butterfly:'Butterfly stretch',hip:'Hip flexor stretch',tiltHow:'Lie with knees bent and feet flat. Gently flatten your lower back by tilting your pelvis, then return to neutral.',bridgeHow:'Lie with knees bent and feet hip-width apart. Press through your heels and lift your hips with control. Avoid over-arching your back.',catHow:'Start on hands and knees. Gently round your back, then return and slightly arch while breathing.',childHow:'Kneel and move your hips toward your heels as comfortable. Reach forward and breathe slowly.',butterflyHow:'Sit with soles of feet together and let knees fall naturally. Do not push down on the knees.',hipHow:'From a half-kneeling position, keep your torso upright and gently shift your hips forward until you feel a mild stretch.',public:'Reference media: Wikimedia Commons / CDC (verify source licence before use)'}
};
let lang=localStorage.getItem('km-lang')||'ms',data=JSON.parse(localStorage.getItem('km-data')||'{"history":[],"settings":{"kh":5,"kr":5,"kn":8,"mh":30,"mr":15,"mn":2,"goal":4,"sound":true}}'),page='home',session=null,loop=null;
const exs=[{id:'kegel',name:'kegel',cat:'k',photo:'https://commons.wikimedia.org/wiki/Special:FilePath/Pelvic%20tilt-CDC%20strength%20training%20for%20older%20adults.gif',how:'kegelHow'},{id:'tilt',name:'tilt',cat:'m',photo:'https://commons.wikimedia.org/wiki/Special:FilePath/Pelvic%20tilt-CDC%20strength%20training%20for%20older%20adults.gif',how:'tiltHow'},{id:'bridge',name:'bridge',cat:'m',photo:'https://images.pexels.com/photos/4056723/pexels-photo-4056723.jpeg?auto=compress&cs=tinysrgb&w=800',how:'bridgeHow'},{id:'catcow',name:'catcow',cat:'m',photo:'https://images.pexels.com/photos/4056725/pexels-photo-4056725.jpeg?auto=compress&cs=tinysrgb&w=800',how:'catHow'},{id:'child',name:'child',cat:'m',photo:'https://images.pexels.com/photos/3822622/pexels-photo-3822622.jpeg?auto=compress&cs=tinysrgb&w=800',how:'childHow'},{id:'butterfly',name:'butterfly',cat:'m',photo:'https://images.pexels.com/photos/4056728/pexels-photo-4056728.jpeg?auto=compress&cs=tinysrgb&w=800',how:'butterflyHow'},{id:'hip',name:'hip',cat:'m',photo:'https://images.pexels.com/photos/4056724/pexels-photo-4056724.jpeg?auto=compress&cs=tinysrgb&w=800',how:'hipHow'}];
const t=k=>words[lang][k]||k,save=()=>localStorage.setItem('km-data',JSON.stringify(data)),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,fmt=s=>Math.floor(s/60)?`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`:`0:${String(Math.floor(s)).padStart(2,'0')}`;
function toast(s){let e=document.querySelector('#toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function stats(){let hist=data.history.filter(x=>x.completed),ws=new Date();ws.setHours(0,0,0,0);ws.setDate(ws.getDate()-((ws.getDay()+6)%7));let wk=hist.filter(x=>new Date(x.date)>=ws),days=new Set(hist.map(x=>x.date.slice(0,10)));let d=new Date();if(!days.has(key(d)))d.setDate(d.getDate()-1);let streak=0;while(days.has(key(d))){streak++;d.setDate(d.getDate()-1)}return{hist,wk,streak,days}}
function photo(ex){return `<img class="photo" src="${ex.photo}" alt="${esc(t(ex.name))}" onerror="this.onerror=null;this.style.display='none'">`}
function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-ms]').forEach(e=>e.textContent=e.dataset[lang]);document.querySelector('#eyebrow').textContent=lang==='ms'?'RUANG LATIHAN PERIBADI':'YOUR PERSONAL TRAINING SPACE';let v=document.querySelector('#view');v.innerHTML=page==='home'?home():page==='workouts'?workouts():page==='progress'?progress():settings();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
function home(){let s=stats(),mins=Math.round(s.wk.reduce((a,x)=>a+x.durationSec,0)/60);return `<h2 class="title">${t('hello')}</h2><p class="sub">${new Date().toLocaleDateString(lang==='ms'?'ms-MY':'en-GB',{weekday:'long',day:'numeric',month:'long'})}</p><section class="hero"><span class="tag">${t('today')}</span><h2>${t('kegel')} + ${t('mobility')}</h2><p class="sub">${lang==='ms'?'Sesi ringkas, ubah tempoh mengikut keselesaan.':'A short session; adjust timing to your comfort.'}</p><button class="btn" onclick="start('combo')">▶ ${t('start')}</button></section><div class="grid"><div class="stat"><b>${s.wk.length}</b><small>${t('week')}</small></div><div class="stat"><b>${mins}</b><small>${t('minutes')}</small></div><div class="stat"><b>${s.streak}</b><small>${t('streak')}</small></div></div><h3>${t('quick')}</h3><div class="two"><button class="btn secondary" onclick="start('kegel')">${t('kegel')}</button><button class="btn secondary" onclick="start('mob')">${t('mobility')}</button></div><h3>${t('history')}</h3>${s.hist[0]?`<div class="card"><b>${esc(s.hist[0].name)}</b><p class="sub">${new Date(s.hist[0].date).toLocaleString()} · ${fmt(s.hist[0].durationSec)}</p></div>`:`<div class="card"><b>${t('empty')}</b><p class="sub">${t('noData')}</p></div>`}`}
function workouts(){return `<h2 class="title">${t('choose')}</h2><p class="sub">${t('safety')}</p><div class="card"><h3>${t('kegel')}</h3>${photo(exs[0])}<p class="sub">${t('kegelHow')}</p><button class="btn block" onclick="start('kegel')">${t('start')}</button></div>${exs.filter(x=>x.cat==='m').map(x=>`<div class="card exercise"><h3>${t(x.name)}</h3>${photo(x)}<p>${t(x.how)}</p></div>`).join('')}<button class="btn block" onclick="start('mob')">${t('start')} · ${t('mobility')}</button>`}
function progress(){let s=stats(),d=new Date(),lead=(new Date(d.getFullYear(),d.getMonth(),1).getDay()+6)%7,n=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),cal=Array(lead).fill('<span></span>').concat(Array.from({length:n},(_,i)=>{let day=i+1,k=key(new Date(d.getFullYear(),d.getMonth(),day));return `<span class="day ${s.days.has(k)?'done':''}">${day}</span>`})).join('');return `<h2 class="title">${t('progress')}</h2><div class="grid"><div class="stat"><b>${s.hist.length}</b><small>${t('total')}</small></div><div class="stat"><b>${s.wk.length}</b><small>${t('thisWeek')}</small></div><div class="stat"><b>${s.streak}</b><small>${t('streak')}</small></div></div><div class="card"><h3>${d.toLocaleDateString(lang==='ms'?'ms-MY':'en-GB',{month:'long',year:'numeric'})}</h3><div class="cal">${['M','T','W','T','F','S','S'].map(x=>`<small>${x}</small>`).join('')}${cal}</div></div><h3>${t('history')}</h3>${s.hist.length?s.hist.map(h=>`<div class="card row"><div class="grow"><b>${esc(h.name)}</b><p class="sub">${new Date(h.date).toLocaleString()} · ${fmt(h.durationSec)}</p></div><button class="btn danger" onclick="del('${h.id}')">×</button></div>`).join(''):`<div class="card">${t('noData')}</div>`}`}
function settings(){let s=data.settings;return `<h2 class="title">${t('settings')}</h2><p class="sub">${t('privacy')}</p><div class="card"><div class="setting"><label>${t('language')}</label><select class="field" id="lang"><option value="ms" ${lang==='ms'?'selected':''}>Bahasa Melayu Malaysia</option><option value="en" ${lang==='en'?'selected':''}>English</option></select></div>${[['kh',lang==='ms'?'Kecut Kegel (s)':'Kegel hold (sec)',1,30],['kr',lang==='ms'?'Rehat Kegel (s)':'Kegel rest (sec)',1,60],['kn',lang==='ms'?'Pusingan Kegel':'Kegel rounds',1,50],['mh',lang==='ms'?'Tahan mobiliti (s)':'Mobility hold (sec)',5,180],['mr',lang==='ms'?'Rehat mobiliti (s)':'Mobility rest (sec)',0,120],['mn',lang==='ms'?'Ulangan mobiliti':'Mobility rounds',1,10],['goal',t('goal'),1,7]].map(([id,label,min,max])=>`<div class="setting"><label>${label}</label><input class="field" id="${id}" type="number" min="${min}" max="${max}" value="${s[id]}"></div>`).join('')}<label class="sub"><input id="sound" type="checkbox" ${s.sound?'checked':''}> ${t('sound')}</label><button class="btn block" onclick="saveSettings()">${t('save')}</button></div><div class="card"><h3>${t('export')}</h3><p class="sub">${t('privacy')}</p><button class="btn block" onclick="exportData()">${t('export')}</button><label class="btn secondary block center">${t('import')}<input type="file" accept="application/json" id="import" hidden></label></div><div class="card"><h3>${t('addHome')}</h3><p class="sub">${t('addHomeText')}</p></div><div class="card"><button class="btn danger block" onclick="clearData()">${t('clear')}</button></div><p class="small">${t('safety')}</p>`}
function start(kind){let list=kind==='kegel'?[exs[0]]:kind==='mob'?exs.filter(x=>x.cat==='m'):[exs[0],...exs.filter(x=>x.cat==='m').slice(0,3)],steps=[];list.forEach(ex=>{let n=ex.cat==='k'?data.settings.kn:data.settings.mn;for(let i=0;i<n;i++){steps.push({ex,phase:'work',duration:ex.cat==='k'?data.settings.kh:data.settings.mh,round:i+1,n});let r=ex.cat==='k'?data.settings.kr:data.settings.mr;if(r)steps.push({ex,phase:'rest',duration:r,round:i+1,n})}});session={kind,steps,i:0,left:data.settings.kh,paused:true,prep:true,started:Date.now(),elapsed:0};page='timer';renderTimer()}
function renderTimer(){let v=document.querySelector('#view'),st=session.steps[session.i];if(!st){finish();return}let phase=session.prep?'ready':st.phase==='rest'?'relax':st.ex.cat==='k'?'hold':'work';v.innerHTML=`<button class="btn secondary" onclick="exitTimer()">← ${t('back')}</button><div class="center"><span class="tag">${t(st.ex.name)}</span><h2 class="title">${t(phase)}</h2><p class="sub">${t('round')} ${st.round} ${t('of')} ${st.n}</p><div class="timer" style="--pct:${100-Math.max(0,session.left/(session.prep?data.settings.kh:st.duration)*100)}%"><div class="timer-in"><b>${t(phase)}</b><div class="time">${fmt(session.left)}</div><small>${t('step')} ${session.i+1} ${t('of')} ${session.steps.length}</small></div></div><p class="sub">${t(st.ex.how)}</p><button class="btn secondary" onclick="pauseTimer()">${session.paused?t('resume'):t('pause')}</button> <button class="btn secondary" onclick="skipTimer()">${t('skip')} →</button><button class="btn block" onclick="finish()">${t('finish')}</button><p class="small">${t('timerHint')} ${t('safety')}</p></div>`}
function pauseTimer(){if(session.paused){session.paused=false;session.last=Date.now();loop=setInterval(tick,250)}else{session.paused=true;clearInterval(loop)}renderTimer()}
function tick(){if(!session||session.paused)return;let now=Date.now();session.left-=(now-session.last)/1000;session.last=now;if(session.left<=0){if(session.prep){session.prep=false;session.left=session.steps[session.i].duration}else{session.i++;if(session.i>=session.steps.length){finish();return}session.left=session.steps[session.i].duration}if(data.settings.sound)try{let c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.start();o.stop(c.currentTime+.12)}catch{}}renderTimer()}
function skipTimer(){session.prep=false;session.i++;if(session.i>=session.steps.length){finish();return}session.left=session.steps[session.i].duration;renderTimer()}
function finish(){if(!session)return;clearInterval(loop);let total=session.steps.reduce((a,x)=>a+x.duration,0);data.history.unshift({id:String(Date.now()),name:session.kind==='kegel'?t('kegel'):session.kind==='mob'?t('mobility'):t('kegel')+' + '+t('mobility'),date:new Date().toISOString(),durationSec:total,completed:true});save();session=null;page='home';render();toast(t('completed'))}
function exitTimer(){clearInterval(loop);if(confirm(lang==='ms'?'Keluar daripada sesi tanpa menyimpan?':'Exit without saving?')){session=null;page='workouts';render()}}
function saveSettings(){['kh','kr','kn','mh','mr','mn','goal'].forEach(id=>{let e=document.getElementById(id);data.settings[id]=Math.max(Number(e.min),Math.min(Number(e.max),Number(e.value)||1))});data.settings.sound=document.getElementById('sound').checked;save();toast(t('saved'));render()}
function exportData(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({lang,data},null,2)],{type:'application/json'}));a.href=u;a.download='kegel-mobility-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast(t('exported'))}
function del(id){if(confirm(lang==='ms'?'Padam rekod ini?':'Delete this record?')){data.history=data.history.filter(x=>x.id!==id);save();render()}}
function clearData(){if(confirm(t('confirmClear'))){data.history=[];save();render()}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}});
document.addEventListener('change',e=>{if(e.target.id==='lang'){lang=e.target.value;localStorage.setItem('km-lang',lang);render()}if(e.target.id==='import'&&e.target.files[0]){let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.data||!Array.isArray(x.data.history))throw 0;data=x.data;lang=x.lang||lang;localStorage.setItem('km-lang',lang);save();render();toast(t('imported'))}catch{toast(t('badFile'))}};r.readAsText(e.target.files[0])}});
document.querySelector('#quickLang').onclick=()=>{lang=lang==='ms'?'en':'ms';localStorage.setItem('km-lang',lang);render()};render();
</script></body></html>
